name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm # GitHub Actions cache for ~/.npm, keyed on package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        uses: awalsh128/cache-apt-pkgs-action@v1 # apt packages cached via GitHub Actions cache
        with:
          packages: luajit
          version: 1.0
      - name: Syntax check plugin
        run: luajit -bl plugin/autorun.lua > /dev/null
